<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Парковое приложение</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="/miniapp/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">ПАРКОВОЕ ПРИЛОЖЕНИЕ</div>
        <h1 id="driverName">Заказы</h1>
        <div class="muted" id="driverCar">Загрузка...</div>
      </div>
      <button class="icon-button" id="refreshButton" aria-label="Обновить">↻</button>
    </header>

    <main>
      <section id="ordersView" class="view active">
        <div class="summary-grid">
          <div class="summary-card">
            <span>Новые</span>
            <strong id="incomingCount">—</strong>
          </div>
          <div class="summary-card">
            <span>Средняя цена</span>
            <strong id="averagePrice">—</strong>
          </div>
          <div class="summary-card">
            <span>Точные</span>
            <strong id="exactCount">—</strong>
          </div>
        </div>

        <div class="section-title-row">
          <div>
            <h2>Поступающие заказы</h2>
            <p>Fasten, Яндекс и Везёт в одной ленте</p>
          </div>
        </div>

        <div class="chips" id="sourceFilters">
          <button class="chip active" data-source="all">Все</button>
          <button class="chip" data-source="fasten">Fasten</button>
          <button class="chip" data-source="yandex">Яндекс</button>
          <button class="chip" data-source="vezet">Везёт</button>
        </div>

        <div class="filter-row">
          <select id="statusFilter">
            <option value="incoming">Новые</option>
            <option value="all">Все статусы</option>
            <option value="accepted">Принятые</option>
          </select>
          <select id="tariffFilter">
            <option value="all">Все тарифы</option>
            <option value="econom">Эконом</option>
            <option value="comfort">Комфорт</option>
            <option value="comfort_plus">Комфорт+</option>
            <option value="business">Бизнес</option>
          </select>
        </div>

        <div id="ordersList" class="orders-list"></div>
        <div id="emptyState" class="empty-state hidden">Под этот фильтр заказов нет.</div>
        <p class="disclaimer" id="priceDisclaimer"></p>
      </section>

      <section id="statsView" class="view">
        <div class="section-title-row">
          <div>
            <h2>Статистика ленты</h2>
            <p>Что сейчас приходит водителю</p>
          </div>
        </div>
        <div class="stats-panel" id="statsPanel"></div>
      </section>

      <section id="profileView" class="view">
        <div class="profile-card" id="profileCard"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-view="ordersView"><span>🚕</span>Заказы</button>
      <button class="nav-item" data-view="statsView"><span>📊</span>Статистика</button>
      <button class="nav-item" data-view="profileView"><span>👤</span>Профиль</button>
    </nav>
  </div>

  <div class="sheet-backdrop hidden" id="sheetBackdrop">
    <article class="sheet" id="orderSheet">
      <div class="sheet-handle"></div>
      <button class="sheet-close" id="sheetClose">✕</button>
      <div id="sheetContent"></div>
    </article>
  </div>

  <div class="toast hidden" id="toast"></div>
  <script src="/miniapp/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Fleet Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/miniapp/styles.css" />
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 2 5.5"/><path d="M20 4v7h-7"/></symbol>
    <symbol id="i-orders" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 8h10M7 12h10M7 16h6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.8-4 3.3-6 7.5-6s6.7 2 7.5 6"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 16h14l-1.2-6.1A2 2 0 0 0 15.8 8H8.2a2 2 0 0 0-2 1.6L5 16Z"/><path d="M4 13h16v6H4z"/><circle cx="7" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 22V4"/><path d="M5 5h11l-2 4 2 4H5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h3a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/></symbol>
    <symbol id="i-cash" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M7 9H6v1M17 15h1v-1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-trending" viewBox="0 0 24 24"><path d="m4 17 6-6 4 4 6-7"/><path d="M15 8h5v5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-calculator" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M16 15h0"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.8 2.8 8 7 10 4.2-2 7-5.2 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
  </svg>

  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-copy">
        <div class="eyebrow">FLEET HUB</div>
        <h1 id="pageTitle">Заказы</h1>
        <p class="topbar-subtitle" id="driverCar">Загрузка данных</p>
      </div>
      <button class="icon-btn" id="refreshButton" type="button" aria-label="Обновить">
        <svg class="icon"><use href="#i-refresh"></use></svg>
      </button>
    </header>

    <main class="content">
      <section id="ordersView" class="view active">
        <div class="summary-grid">
          <article class="metric-card">
            <div class="metric-icon"><svg class="icon"><use href="#i-orders"></use></svg></div>
            <div><span>Новые</span><strong id="incomingCount">—</strong></div>
          </article>
          <article class="metric-card">
            <div class="metric-icon"><svg class="icon"><use href="#i-trending"></use></svg></div>
            <div><span>Средняя цена</span><strong id="averagePrice">—</strong></div>
          </article>
          <article class="metric-card">
            <div class="metric-icon"><svg class="icon"><use href="#i-check"></use></svg></div>
            <div><span>Активные</span><strong id="activeCount">—</strong></div>
          </article>
        </div>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2 id="ordersSectionTitle">Поступающие заказы</h2>
              <p id="ordersSectionSubtitle">Fasten, Яндекс и Везёт в одной ленте</p>
            </div>
          </div>

          <div class="tabs" id="sourceFilters">
            <button class="tab active" type="button" data-source="all">Все</button>
            <button class="tab" type="button" data-source="fasten">Fasten</button>
            <button class="tab" type="button" data-source="yandex">Яндекс</button>
            <button class="tab" type="button" data-source="vezet">Везёт</button>
          </div>

          <div class="filter-row">
            <label class="field compact">
              <span>Статус</span>
              <select id="statusFilter">
                <option value="incoming">Новые</option>
                <option value="all">Все статусы</option>
                <option value="active">Активные</option>
                <option value="completed">Завершённые</option>
              </select>
            </label>
            <label class="field compact">
              <span>Тариф</span>
              <select id="tariffFilter">
                <option value="all">Все тарифы</option>
                <option value="econom">Эконом</option>
                <option value="comfort">Комфорт</option>
                <option value="comfort_plus">Комфорт+</option>
                <option value="business">Бизнес</option>
              </select>
            </label>
          </div>

          <div id="ordersList" class="orders-list"></div>
          <div id="emptyState" class="empty-state hidden">
            <svg class="empty-icon"><use href="#i-orders"></use></svg>
            <strong>Заказов нет</strong>
            <span>Измените фильтры или обновите ленту.</span>
          </div>
        </section>

        <div class="info-note">
          <svg class="icon"><use href="#i-calculator"></use></svg>
          <p id="priceDisclaimer"></p>
        </div>
      </section>

      <section id="statsView" class="view">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>Статистика ленты</h2>
              <p>Текущая картина поступающих заказов</p>
            </div>
          </div>
          <div class="stats-panel" id="statsPanel"></div>
        </section>
      </section>

      <section id="profileView" class="view">
        <section class="panel profile-card" id="profileCard"></section>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Навигация">
      <button class="nav-item active" type="button" data-view="ordersView" data-title="Заказы">
        <svg class="nav-icon"><use href="#i-orders"></use></svg>
        <span>Заказы</span>
      </button>
      <button class="nav-item" type="button" data-view="statsView" data-title="Статистика">
        <svg class="nav-icon"><use href="#i-chart"></use></svg>
        <span>Статистика</span>
      </button>
      <button class="nav-item" type="button" data-view="profileView" data-title="Профиль">
        <svg class="nav-icon"><use href="#i-user"></use></svg>
        <span>Профиль</span>
      </button>
    </nav>
  </div>

  <div class="sheet-backdrop hidden" id="sheetBackdrop">
    <article class="sheet" id="orderSheet" role="dialog" aria-modal="true" aria-label="Детали заказа">
      <div class="sheet-handle"></div>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="Закрыть">
        <svg class="icon"><use href="#i-close"></use></svg>
      </button>
      <div id="sheetContent"></div>
    </article>
  </div>

  <div class="toast hidden" id="toast" role="status"></div>
  <script src="/miniapp/app.js"></script>
</body>
</html>
